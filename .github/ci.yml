name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run type-check
      - run: npm run test
      - run: npm run build

  native-engine:
    name: C++ engine (native tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build cpp/build --parallel
      - run: ctest --test-dir cpp/build --output-on-failure

  wasm-engine:
    name: C++ engine (WebAssembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - run: bash cpp/build_wasm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vector-engine-wasm
          path: public/wasm/vector_engine.*
